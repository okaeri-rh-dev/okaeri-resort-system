<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Okaeri Resort Management - Test Page</title>
    <meta
      name="description"
      content="Comprehensive resort management system for efficient operations and guest services"
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #0ea5e9 0%, #10b981 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 90%;
        text-align: center;
      }

      .logo {
        font-size: 2rem;
        font-weight: bold;
        color: #0ea5e9;
        margin-bottom: 1rem;
      }

      h1 {
        color: #1f2937;
        margin-bottom: 0.5rem;
        font-size: 1.5rem;
      }

      p {
        color: #6b7280;
        margin-bottom: 1.5rem;
      }

      .btn {
        background: #0ea5e9;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
        display: inline-block;
        text-decoration: none;
      }

      .btn:hover {
        background: #0284c7;
      }

      .metrics {
        margin-top: 2rem;
        padding: 1rem;
        background: #f8fafc;
        border-radius: 0.5rem;
        border-left: 4px solid #10b981;
      }

      .metrics h2 {
        color: #1f2937;
        font-size: 1rem;
        margin-bottom: 0.5rem;
      }

      .metrics-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
        font-size: 0.875rem;
      }

      .metric {
        color: #4b5563;
      }

      .metric strong {
        color: #10b981;
      }

      @media (max-width: 640px) {
        .container {
          padding: 1.5rem;
        }

        .logo {
          font-size: 1.5rem;
        }

        h1 {
          font-size: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🏝️ Okaeri</div>
      <h1>Resort Management System</h1>
      <p>
        Experience seamless resort operations with our comprehensive management platform designed
        for efficiency and excellence.
      </p>

      <a href="#" class="btn" onclick="showMessage()">Get Started</a>

      <div class="metrics">
        <h2>Performance Targets</h2>
        <div class="metrics-grid">
          <div class="metric">Performance: <strong>>95</strong></div>
          <div class="metric">Accessibility: <strong>>95</strong></div>
          <div class="metric">Best Practices: <strong>>95</strong></div>
          <div class="metric">SEO: <strong>>95</strong></div>
        </div>
      </div>
    </div>

    <script>
      // Performance measurement
      window.addEventListener("load", () => {
        setTimeout(() => {
          if ("performance" in window) {
            const paintEntries = performance.getEntriesByType("paint");
            paintEntries.forEach((entry) => {
              console.log(`${entry.name}: ${entry.startTime}ms`);
            });
          }
        }, 0);
      });

      function showMessage() {
        alert("Lighthouse test page is working correctly!");
      }

      // Service worker registration (if available)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {
            // Service worker not available, continue normally
          });
        });
      }
    </script>
  </body>
</html>
