# Scheduled Cleanup Tasks
#
# Replaces Cloudflare Workers cron triggers (not supported by Pages)
# Calls HTTP endpoints protected by CRON_SECRET Bearer token
#
# Schedules (UTC):
# - Daily 2:00 AM: Cleanup expired idempotency keys (48+ hours old)
# - Weekly payment-proofs cleanup is DISABLED (schedule removed). The prod
#   function cleanup_expired_payment_proofs() does not exist yet — a verbatim
#   port fails/no-ops (schema mismatch: check_out vs check_out_date, real
#   statuses Confirmed/Cancelled/Pending). See migration 20260715000000_*.sql
#   and vault note [[whole-app-audit-2026-07-21]]. Re-add "0 3 * * 0" once ported.
#
# Manual trigger: GitHub Actions > Scheduled Cleanup Tasks > Run workflow

name: Scheduled Cleanup Tasks

on:
  schedule:
    # Daily at 2:00 AM UTC (10:00 AM PHT) — idempotency-key cleanup only.
    - cron: "0 2 * * *"
    # NOTE: weekly payment-proofs schedule ("0 3 * * 0") intentionally removed —
    # see header. Re-add here when cleanup_expired_payment_proofs() lands on prod.
  workflow_dispatch:
    inputs:
      task:
        description: "Which cleanup task to run"
        required: true
        # Default to the working task; payment-proofs is opt-in until ported.
        default: "idempotency"
        type: choice
        options:
          - both
          - idempotency
          - payment-proofs

env:
  PRODUCTION_URL: https://okaeri-resort.pages.dev

jobs:
  cleanup-idempotency:
    name: Cleanup Idempotency Keys
    runs-on: ubuntu-latest
    # Run daily at 2 AM UTC, or when manually triggered with 'both' or 'idempotency'
    if: |
      github.event.schedule == '0 2 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'both' || github.event.inputs.task == 'idempotency'))
    steps:
      - name: Trigger idempotency cleanup
        run: |
          echo "Starting idempotency key cleanup..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.PRODUCTION_URL }}/api/cron/cleanup-idempotency")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Cleanup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Idempotency cleanup completed successfully"

  cleanup-payment-proofs:
    name: Cleanup Payment Proofs
    runs-on: ubuntu-latest
    # DISABLED on schedule (weekly cron removed — prod function absent; see header).
    # Runs only via manual workflow_dispatch with task 'payment-proofs' or 'both'.
    if: |
      github.event.schedule == '0 3 * * 0' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'both' || github.event.inputs.task == 'payment-proofs'))
    steps:
      - name: Trigger payment proof cleanup
        run: |
          echo "Starting payment proof cleanup..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.PRODUCTION_URL }}/api/cron/cleanup-payment-proofs")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Cleanup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Payment proof cleanup completed successfully"
