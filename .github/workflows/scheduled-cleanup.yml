# Scheduled Cleanup Tasks
#
# Replaces Cloudflare Workers cron triggers (not supported by Pages)
# Calls HTTP endpoints protected by CRON_SECRET Bearer token
#
# Schedules (UTC):
# - Daily 2:00 AM: Cleanup expired idempotency keys (48+ hours old)
# - Weekly Sunday 3:00 AM: Cleanup expired payment proofs (90/30 days retention)
#
# Manual trigger: GitHub Actions > Scheduled Cleanup Tasks > Run workflow

name: Scheduled Cleanup Tasks

on:
  schedule:
    # Daily at 2:00 AM UTC (10:00 AM PHT)
    - cron: "0 2 * * *"
    # Weekly on Sunday at 3:00 AM UTC (11:00 AM PHT)
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "Which cleanup task to run"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - idempotency
          - payment-proofs

env:
  PRODUCTION_URL: https://okaeri-resort.pages.dev

jobs:
  cleanup-idempotency:
    name: Cleanup Idempotency Keys
    runs-on: ubuntu-latest
    # Run daily at 2 AM UTC, or when manually triggered with 'both' or 'idempotency'
    if: |
      github.event.schedule == '0 2 * * *' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'both' || github.event.inputs.task == 'idempotency'))
    steps:
      - name: Trigger idempotency cleanup
        run: |
          echo "Starting idempotency key cleanup..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.PRODUCTION_URL }}/api/cron/cleanup-idempotency")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Cleanup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Idempotency cleanup completed successfully"

  cleanup-payment-proofs:
    name: Cleanup Payment Proofs
    runs-on: ubuntu-latest
    # Run weekly on Sunday at 3 AM UTC, or when manually triggered with 'both' or 'payment-proofs'
    if: |
      github.event.schedule == '0 3 * * 0' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.task == 'both' || github.event.inputs.task == 'payment-proofs'))
    steps:
      - name: Trigger payment proof cleanup
        run: |
          echo "Starting payment proof cleanup..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ env.PRODUCTION_URL }}/api/cron/cleanup-payment-proofs")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Cleanup failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Payment proof cleanup completed successfully"
