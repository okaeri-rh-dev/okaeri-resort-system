name: Optimized CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - staging
          - production

# Optimize for free tier usage
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Deterministic testing environment (from TDD_SINGLE_SOURCE_OF_TRUTH.md)
  FIXED_TIME: "2024-01-01T00:00:00Z"
  RANDOM_SEED: "test-seed-2024"
  TEST_SCENARIO: "STABLE"
  MOCK_DELAY: "0"
  TZ: "Asia/Manila"

  # Test configuration
  NODE_ENV: "test"
  VITE_USE_MOCK_API: "true"
  VITEST_DETERMINISTIC: "true"
  TEST_TIMEOUT: "30000"

  # Performance budget thresholds
  MAX_BUNDLE_SIZE_KB: 150
  MAX_VENDOR_SIZE_KB: 200
  MAX_CSS_SIZE_KB: 50
  LIGHTHOUSE_SCORE_THRESHOLD: 90

jobs:
  # ==========================================
  # PHASE 1: Quality Gates & Security
  # ==========================================

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.deploy-decision.outputs.should-deploy }}
      environment: ${{ steps.deploy-decision.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need history for bundle size comparison
          fetch-depth: 0

      - name: Setup Node.js with caching
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies with retry
        run: |
          npm ci --prefer-offline --no-audit --progress=false || \
          npm ci --prefer-offline --no-audit --progress=false || \
          npm ci --no-audit --progress=false

      # Parallel quality checks for speed
      - name: Run linting
        run: npm run lint -- --max-warnings 0

      - name: Check code formatting
        run: npm run format:check

      - name: TypeScript type checking
        run: npm run type-check

      - name: Security audit (dependencies)
        run: |
          # Allow moderate vulnerabilities, block high/critical
          npm audit --audit-level=high --omit=dev || {
            echo "❌ High-severity vulnerabilities found"
            npm audit --audit-level=high --omit=dev
            exit 1
          }

      - name: Determine deployment environment
        id: deploy-decision
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # PHASE 2: Deterministic Testing
  # ==========================================

  deterministic-tests:
    name: Deterministic Tests
    runs-on: ubuntu-latest
    needs: quality-gates

    strategy:
      matrix:
        test-suite: [unit, integration, security]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Setup test environment
        run: |
          # Create deterministic test environment
          cp .env.test.example .env.test
          # The canonical values are already in .env.test.example
          # No need to append additional values since they're defined at workflow level

      - name: Run ${{ matrix.test-suite }} tests (deterministic mode)
        run: |
          # Configure test environment for deterministic execution
          export NODE_ENV=test
          export VITEST_DETERMINISTIC=true
          export TEST_SCENARIO=STABLE

          case "${{ matrix.test-suite }}" in
            "unit")
              npm run test:coverage -- \
                --reporter=json \
                --outputFile=coverage-${{ matrix.test-suite }}.json \
                --run \
                --passWithNoTests \
                --testTimeout=30000 \
                --teardownTimeout=10000
              ;;
            "integration")
              npm run test:db -- \
                --run \
                --reporter=json \
                --outputFile=test-results-${{ matrix.test-suite }}.json
              ;;
            "security")
              npm run verify:security
              ;;
          esac

      - name: Validate test results
        run: |
          if [ "${{ matrix.test-suite }}" = "unit" ] && [ -f coverage-unit.json ]; then
            # Check coverage thresholds
            coverage_lines=$(cat coverage-unit.json | jq '.total.lines.percent // 0')
            coverage_functions=$(cat coverage-unit.json | jq '.total.functions.percent // 0')
            coverage_branches=$(cat coverage-unit.json | jq '.total.branches.percent // 0')
            
            if (( $(echo "$coverage_lines < 90" | bc -l) )); then
              echo "❌ Line coverage $coverage_lines% below 90% threshold"
              exit 1
            fi
            
            if (( $(echo "$coverage_functions < 75" | bc -l) )); then
              echo "⚠️ Function coverage $coverage_functions% below 75% target"
            fi
            
            echo "✅ Coverage: Lines $coverage_lines%, Functions $coverage_functions%, Branches $coverage_branches%"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.test-suite }}-${{ github.run_id }}
          path: |
            coverage-*.json
            test-results-*.json
            test-results/
          retention-days: 7

  # ==========================================
  # PHASE 3: Build & Performance Analysis
  # ==========================================

  build-and-analyze:
    name: Build & Performance Analysis
    runs-on: ubuntu-latest
    needs: [quality-gates, deterministic-tests]
    outputs:
      bundle-size-status: ${{ steps.bundle-analysis.outputs.status }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build application
        run: |
          # Production build with bundle analysis
          NODE_ENV=production npm run build

          # Generate bundle analysis
          ANALYZE=true npm run build:analyze || echo "Bundle analysis completed"
        env:
          NODE_ENV: production
          VITE_API_URL: /api
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Bundle size analysis
        id: bundle-analysis
        run: |
          echo "=== Bundle Size Analysis ===" | tee bundle-report.txt

          # Check main bundle
          main_js=$(find dist/assets -name "*.js" -not -name "*vendor*" -exec du -k {} \; | sort -nr | head -1)
          main_size_kb=$(echo $main_js | cut -f1)
          main_file=$(echo $main_js | cut -f2)

          # Check vendor bundle
          vendor_js=$(find dist/assets -name "*vendor*.js" -exec du -k {} \; | sort -nr | head -1)
          vendor_size_kb=$(echo $vendor_js | cut -f1 | head -1)

          # Check CSS bundle
          css_size_kb=$(find dist/assets -name "*.css" -exec du -k {} \; | awk '{sum+=$1} END {print sum+0}')

          # Total uncompressed size
          total_size_kb=$((main_size_kb + vendor_size_kb + css_size_kb))

          echo "Main JS Bundle: ${main_size_kb}KB (max: ${{ env.MAX_BUNDLE_SIZE_KB }}KB)" | tee -a bundle-report.txt
          echo "Vendor Bundle: ${vendor_size_kb}KB (max: ${{ env.MAX_VENDOR_SIZE_KB }}KB)" | tee -a bundle-report.txt
          echo "CSS Bundle: ${css_size_kb}KB (max: ${{ env.MAX_CSS_SIZE_KB }}KB)" | tee -a bundle-report.txt
          echo "Total: ${total_size_kb}KB" | tee -a bundle-report.txt

          # Check against budgets
          status="success"
          if [ "$main_size_kb" -gt "${{ env.MAX_BUNDLE_SIZE_KB }}" ]; then
            echo "❌ Main bundle exceeds budget: ${main_size_kb}KB > ${{ env.MAX_BUNDLE_SIZE_KB }}KB" | tee -a bundle-report.txt
            status="failed"
          fi

          if [ "$vendor_size_kb" -gt "${{ env.MAX_VENDOR_SIZE_KB }}" ]; then
            echo "❌ Vendor bundle exceeds budget: ${vendor_size_kb}KB > ${{ env.MAX_VENDOR_SIZE_KB }}KB" | tee -a bundle-report.txt
            status="failed"
          fi

          if [ "$css_size_kb" -gt "${{ env.MAX_CSS_SIZE_KB }}" ]; then
            echo "❌ CSS bundle exceeds budget: ${css_size_kb}KB > ${{ env.MAX_CSS_SIZE_KB }}KB" | tee -a bundle-report.txt
            status="failed"
          fi

          if [ "$status" = "success" ]; then
            echo "✅ All bundles within performance budget" | tee -a bundle-report.txt
          fi

          echo "status=$status" >> $GITHUB_OUTPUT

          # Export for other jobs
          echo "MAIN_BUNDLE_SIZE_KB=$main_size_kb" >> $GITHUB_ENV
          echo "VENDOR_BUNDLE_SIZE_KB=$vendor_size_kb" >> $GITHUB_ENV
          echo "CSS_BUNDLE_SIZE_KB=$css_size_kb" >> $GITHUB_ENV

      - name: Run bundlesize check
        run: |
          # Use bundlesize for precise gzipped measurements
          npm run perf:budget || {
            echo "❌ Bundle size check failed"
            echo "See bundlesize.config.json for current budgets"
            exit 1
          }

      - name: Generate bundle visualization
        if: always()
        run: |
          # Create bundle analysis HTML if not already created
          if [ ! -f "dist/bundle-analysis.html" ]; then
            ANALYZE=true npm run build
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: |
            dist/
            bundle-report.txt
            dist/bundle-analysis.html
          retention-days: 7

      # Fail the job if bundle size exceeded budgets
      - name: Validate performance budgets
        run: |
          if [ "${{ steps.bundle-analysis.outputs.status }}" = "failed" ]; then
            echo "❌ Performance budget validation failed"
            cat bundle-report.txt
            exit 1
          fi
          echo "✅ Performance budgets validated"

  # ==========================================
  # PHASE 4: Security Scanning
  # ==========================================

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      # Secret scanning
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      # Dependency vulnerability scanning
      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable
        continue-on-error: false

      # Code security analysis
      - name: Run CodeQL security analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

      # Check security headers and configurations
      - name: Validate security configurations
        run: |
          echo "=== Security Configuration Validation ===" | tee security-report.txt

          # Check vercel.json security headers
          if ! grep -q "Content-Security-Policy" vercel.json; then
            echo "❌ Missing Content-Security-Policy" | tee -a security-report.txt
            exit 1
          fi

          if ! grep -q "X-Frame-Options" vercel.json; then
            echo "❌ Missing X-Frame-Options" | tee -a security-report.txt
            exit 1
          fi

          if ! grep -q "Strict-Transport-Security" vercel.json; then
            echo "❌ Missing HSTS header" | tee -a security-report.txt
            exit 1
          fi

          # Check for CORS wildcards
          if grep -q '"Access-Control-Allow-Origin".*"\*"' vercel.json; then
            echo "❌ CORS wildcard detected - security risk!" | tee -a security-report.txt
            exit 1
          fi

          echo "✅ Security headers properly configured" | tee -a security-report.txt

      # Environment security checks
      - name: Check environment security
        run: |
          # Ensure no secrets in environment files
          if find . -name ".env*" -not -name ".env.example" -exec grep -l "sk_\|pk_\|secret" {} \; | grep -v ".env.example"; then
            echo "❌ Potential secrets found in environment files"
            exit 1
          fi

          echo "✅ Environment files secure" | tee -a security-report.txt

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: security-report.txt
          retention-days: 30

  # ==========================================
  # PHASE 5: End-to-End Testing (Conditional)
  # ==========================================

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [deterministic-tests, build-and-analyze]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --progress=false
          npx playwright install chromium --with-deps

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: dist/

      - name: Setup test environment
        run: |
          # Use deterministic E2E environment
          cp .env.test.example .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "VITE_USE_MOCK_API=true" >> .env.test
          echo "PLAYWRIGHT_DETERMINISTIC=true" >> .env.test

      - name: Run E2E tests (deterministic)
        run: |
          # Run with deterministic settings
          npm run test:e2e -- \
            --reporter=html \
            --output-dir=playwright-report \
            --timeout=30000 \
            --retries=1
        env:
          NODE_ENV: test
          PLAYWRIGHT_DETERMINISTIC: true
          CI: true

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ==========================================
  # PHASE 6: Lighthouse Performance Testing
  # ==========================================

  lighthouse-performance:
    name: Lighthouse Performance
    runs-on: ubuntu-latest
    needs: build-and-analyze

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: dist/

      - name: Run Lighthouse CI
        run: |
          # Create Lighthouse configuration
          cat > lighthouserc.js << 'EOF'
          module.exports = {
            ci: {
              collect: {
                staticDistDir: './dist',
                url: ['/', '/login', '/dashboard'],
                numberOfRuns: 3,
                settings: {
                  chromeFlags: '--no-sandbox --disable-dev-shm-usage',
                  preset: 'desktop',
                  throttling: {
                    rttMs: 40,
                    throughputKbps: 11024,
                    cpuSlowdownMultiplier: 1,
                    requestLatencyMs: 0,
                    downloadThroughputKbps: 0,
                    uploadThroughputKbps: 0
                  },
                  onlyAudits: [
                    'first-contentful-paint',
                    'largest-contentful-paint',
                    'interactive',
                    'cumulative-layout-shift',
                    'total-blocking-time'
                  ]
                }
              },
              assert: {
                assertions: {
                  'categories:performance': ['error', { minScore: 0.9 }],
                  'first-contentful-paint': ['error', { maxNumericValue: 1500 }],
                  'largest-contentful-paint': ['error', { maxNumericValue: 2500 }],
                  'interactive': ['error', { maxNumericValue: 3500 }],
                  'cumulative-layout-shift': ['error', { maxNumericValue: 0.1 }],
                  'total-blocking-time': ['error', { maxNumericValue: 300 }]
                }
              },
              upload: {
                target: 'temporary-public-storage'
              }
            }
          };
          EOF

          # Run Lighthouse
          lhci autorun || {
            echo "❌ Lighthouse performance requirements not met"
            echo "Check the detailed report in artifacts"
            exit 1
          }

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: |
            .lighthouseci/
          retention-days: 7

  # ==========================================
  # PHASE 7: Deployment (Conditional)
  # ==========================================

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs:
      [quality-gates, deterministic-tests, build-and-analyze, security-scan]
    if: needs.quality-gates.outputs.should-deploy == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: ${{ needs.quality-gates.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ github.run_id }}
          path: dist/

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: |
          # Deploy based on environment
          if [ "${{ needs.quality-gates.outputs.environment }}" = "production" ]; then
            vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Create deployment summary
        run: |
          echo "# 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ needs.quality-gates.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Size**: ${MAIN_BUNDLE_SIZE_KB}KB (Main), ${VENDOR_BUNDLE_SIZE_KB}KB (Vendor)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quality Metrics" >> $GITHUB_STEP_SUMMARY
          echo "✅ All tests passed (deterministic mode)" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security scan completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Performance budgets validated" >> $GITHUB_STEP_SUMMARY
