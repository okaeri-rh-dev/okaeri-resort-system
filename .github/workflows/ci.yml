name: CI

# Fast, deterministic quality gate: lint, type-check, non-DB unit tests, the
# production build and the production npm audit run as parallel jobs; deploy
# needs all of them.
#
# - Runs on every pull request to main (blocks merge once branch protection is
#   enabled — see vault note [[whole-app-audit-2026-07-21]], Decision 2).
# - Reused by deploy-cloudflare.yml via `workflow_call`, so nothing reaches
#   production without passing this gate first.
#
# Needs NO secrets: vitest.config.ts hard-codes local Supabase fallbacks and the
# non-DB suite mocks the network (MSW), so it runs fully offline. Deeper DB +
# Playwright E2E checks live in infra-health.yml (push to main + weekly).
#
# `type-check` covers src/, functions/, e2e/ and the tests in src/ and __tests__/.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid PR pushes) to save minutes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # routeTree.gen.ts is gitignored and normally produced by the vite plugin;
      # without it, lint, tsc and tests can't resolve @/routeTree.gen.
      - run: npm run generate:routes
      - name: Lint
        run: npm run lint

  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # routeTree.gen.ts is gitignored and normally produced by the vite plugin;
      # without it, lint, tsc and tests can't resolve @/routeTree.gen.
      - run: npm run generate:routes
      - name: Type-check (src, functions, e2e)
        run: npm run type-check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # routeTree.gen.ts is gitignored and normally produced by the vite plugin;
      # without it, lint, tsc and tests can't resolve @/routeTree.gen.
      - run: npm run generate:routes
      - name: Unit tests (non-DB)
        run: npm run test:no-db

  # Unused files, exports and dependencies; knip.json lists the entry points and exclusions.
  knip:
    name: Knip (dead code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run generate:routes
      - name: Knip
        run: npm run knip

  # The deploy job's build, without secrets: config that only Rollup resolves (manualChunks,
  # PWA, plugins) fails here instead of after the merge to main.
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build frontend and functions
        run: npm run build:full

  # Production dependencies only: a high or critical advisory blocks deploy.
  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
