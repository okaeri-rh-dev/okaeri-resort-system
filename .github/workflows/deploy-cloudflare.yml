name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # Docs-only pushes change nothing that runs; skipping them saves Actions minutes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: # Allow manual triggering

jobs:
  # Blocking quality gate: every job in ci.yml (lint, type-check, unit, knip, audit).
  # Deploy is skipped entirely if this fails, so a red build never ships.
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and Deploy to Cloudflare Pages
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and functions
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build:full

      - name: Verify dist structure
        run: |
          echo "📦 Checking dist/ contents..."
          ls -la dist/
          echo ""
          echo "📂 Source functions/ structure:"
          find functions -type f | sort
          echo ""
          echo "📊 Source file count:"
          find functions -type f | wc -l
          echo ""
          echo "📂 Built dist/functions/ structure:"
          find dist/functions -type f 2>/dev/null | sort || echo "❌ No functions directory found"
          echo ""
          echo "📊 Built file count:"
          find dist/functions -type f 2>/dev/null | wc -l || echo "0"
          echo ""
          echo "✅ Verification complete"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=okaeri-resort

      - name: Deployment summary
        run: |
          echo "🚀 Deployment triggered successfully!"
          echo "📍 URL: https://okaeri-resort.pages.dev"
          echo "🔍 Check deployment status in Cloudflare Dashboard"
