name: Test & Performance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/

      - name: Check coverage thresholds
        run: |
          echo "Checking coverage thresholds..."
          npx vitest run --coverage --reporter=json
          node -e "
            const coverage = require('./coverage/coverage-final.json');
            const totals = Object.values(coverage).reduce((acc, file) => {
              Object.keys(file.s).forEach(key => {
                acc.statements.covered += file.s[key] > 0 ? 1 : 0;
                acc.statements.total++;
              });
              return acc;
            }, { statements: { covered: 0, total: 0 } });
            const pct = (totals.statements.covered / totals.statements.total) * 100;
            console.log(\`Coverage: \${pct.toFixed(2)}%\`);
            if (pct < 70) {
              console.error('Coverage below 70% threshold');
              process.exit(1);
            }
          " || true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build:phase2

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  performance:
    name: Performance Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:phase2

      - name: Check bundle size
        run: npm run bundle:size

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:5173/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          configPath: "./.lighthouserc.json"

      - name: Memory leak tests
        run: npm run test:performance

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            dist/bundle-stats.html
            .lighthouseci/
