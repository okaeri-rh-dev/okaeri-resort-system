name: Production Monitoring & Health Checks

on:
  schedule:
    # Run every 30 minutes during business hours (6 AM - 11 PM UTC)
    - cron: "0,30 6-23 * * *"
    # Run every 2 hours during off-hours
    - cron: "0 0-5,24 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to monitor"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging
      check_type:
        description: "Type of check to run"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - health-only
          - performance-only

env:
  NODE_VERSION: "20"

jobs:
  # ==========================================
  # Health Check Monitoring
  # ==========================================

  health-check:
    name: Health Check Monitor
    runs-on: ubuntu-latest

    strategy:
      matrix:
        environment: [production, staging]

    steps:
      - name: Determine monitoring URLs
        id: urls
        run: |
          if [ "${{ matrix.environment }}" = "production" ]; then
            echo "base_url=https://okaeri-resort.vercel.app" >> $GITHUB_OUTPUT
            echo "api_url=https://okaeri-resort.vercel.app/api" >> $GITHUB_OUTPUT
          else
            echo "base_url=https://okaeri-resort-staging.vercel.app" >> $GITHUB_OUTPUT
            echo "api_url=https://okaeri-resort-staging.vercel.app/api" >> $GITHUB_OUTPUT
          fi

      - name: Check application health
        run: |
          echo "=== Health Check Report (${{ matrix.environment }}) ===" | tee health-report.txt
          echo "Timestamp: $(date)" | tee -a health-report.txt
          echo "" | tee -a health-report.txt

          # Main application availability
          echo "Checking main application..." | tee -a health-report.txt
          if curl -f -s -o /dev/null -w "%{http_code}" "${{ steps.urls.outputs.base_url }}" | grep -q "200"; then
            echo "✅ Main application is accessible" | tee -a health-report.txt
          else
            echo "❌ Main application is not accessible" | tee -a health-report.txt
            exit 1
          fi

          # API health endpoint
          echo "Checking API health..." | tee -a health-report.txt
          api_response=$(curl -f -s "${{ steps.urls.outputs.api_url }}/health-check" || echo "ERROR")
          if echo "$api_response" | jq -e '.status == "healthy"' > /dev/null 2>&1; then
            echo "✅ API health check passed" | tee -a health-report.txt
            echo "Response: $api_response" | tee -a health-report.txt
          else
            echo "❌ API health check failed" | tee -a health-report.txt
            echo "Response: $api_response" | tee -a health-report.txt
            exit 1
          fi

          # Database connectivity (through API)
          echo "Checking database connectivity..." | tee -a health-report.txt
          db_check=$(curl -f -s "${{ steps.urls.outputs.api_url }}/health-check/database" || echo "ERROR")
          if echo "$db_check" | jq -e '.database.connected == true' > /dev/null 2>&1; then
            echo "✅ Database connectivity confirmed" | tee -a health-report.txt
          else
            echo "❌ Database connectivity issues" | tee -a health-report.txt
            exit 1
          fi

      - name: Response time check
        run: |
          echo "=== Response Time Analysis ===" | tee -a health-report.txt

          # Check main page response time
          main_time=$(curl -w "%{time_total}" -s -o /dev/null "${{ steps.urls.outputs.base_url }}")
          echo "Main page response time: ${main_time}s" | tee -a health-report.txt

          # Check API response time
          api_time=$(curl -w "%{time_total}" -s -o /dev/null "${{ steps.urls.outputs.api_url }}/health-check")
          echo "API response time: ${api_time}s" | tee -a health-report.txt

          # Validate response times
          if (( $(echo "$main_time > 3.0" | bc -l) )); then
            echo "⚠️ Main page response time exceeds 3s threshold" | tee -a health-report.txt
          fi

          if (( $(echo "$api_time > 1.0" | bc -l) )); then
            echo "⚠️ API response time exceeds 1s threshold" | tee -a health-report.txt
          fi

      - name: SSL certificate check
        run: |
          echo "=== SSL Certificate Check ===" | tee -a health-report.txt

          # Extract domain from URL
          domain=$(echo "${{ steps.urls.outputs.base_url }}" | sed 's|https\?://||' | cut -d'/' -f1)

          # Check SSL certificate expiration
          cert_info=$(echo | openssl s_client -servername $domain -connect $domain:443 2>/dev/null | openssl x509 -noout -dates 2>/dev/null)

          if [ $? -eq 0 ]; then
            echo "SSL Certificate information:" | tee -a health-report.txt
            echo "$cert_info" | tee -a health-report.txt
            
            # Extract expiry date and check if it's within 30 days
            expiry_date=$(echo "$cert_info" | grep "notAfter" | cut -d= -f2)
            expiry_epoch=$(date -d "$expiry_date" +%s 2>/dev/null || echo "0")
            current_epoch=$(date +%s)
            days_until_expiry=$(( (expiry_epoch - current_epoch) / 86400 ))
            
            if [ $days_until_expiry -lt 30 ]; then
              echo "⚠️ SSL certificate expires in $days_until_expiry days" | tee -a health-report.txt
            else
              echo "✅ SSL certificate valid for $days_until_expiry days" | tee -a health-report.txt
            fi
          else
            echo "❌ Could not retrieve SSL certificate information" | tee -a health-report.txt
          fi

      - name: Upload health check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-${{ matrix.environment }}-${{ github.run_id }}
          path: health-report.txt
          retention-days: 7

  # ==========================================
  # Performance Monitoring
  # ==========================================

  performance-monitor:
    name: Performance Monitor
    runs-on: ubuntu-latest
    if: github.event.inputs.check_type != 'health-only'

    strategy:
      matrix:
        environment: [production]
        device: [mobile, desktop]

    steps:
      - name: Setup monitoring URLs
        id: urls
        run: |
          if [ "${{ matrix.environment }}" = "production" ]; then
            echo "base_url=https://okaeri-resort.vercel.app" >> $GITHUB_OUTPUT
          else
            echo "base_url=https://okaeri-resort-staging.vercel.app" >> $GITHUB_OUTPUT
          fi

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse performance audit
        run: |
          echo "=== Performance Audit (${{ matrix.environment }} - ${{ matrix.device }}) ===" | tee perf-report.txt
          echo "Timestamp: $(date)" | tee -a perf-report.txt
          echo "" | tee -a perf-report.txt

          # Create Lighthouse config
          cat > lighthouserc.js << 'EOF'
          module.exports = {
            ci: {
              collect: {
                url: ['${{ steps.urls.outputs.base_url }}/', '${{ steps.urls.outputs.base_url }}/dashboard'],
                numberOfRuns: 3,
                settings: {
                  chromeFlags: '--no-sandbox --disable-dev-shm-usage',
                  preset: '${{ matrix.device }}',
                  throttling: ${{ matrix.device == 'mobile' && '{ rttMs: 150, throughputKbps: 1600, cpuSlowdownMultiplier: 4 }' || '{ rttMs: 40, throughputKbps: 10240, cpuSlowdownMultiplier: 1 }' }},
                  onlyCategories: ['performance'],
                  onlyAudits: [
                    'first-contentful-paint',
                    'largest-contentful-paint',
                    'interactive',
                    'cumulative-layout-shift',
                    'total-blocking-time',
                    'speed-index'
                  ]
                }
              },
              assert: {
                assertions: {
                  'categories:performance': ['warn', { minScore: 0.8 }],
                  'first-contentful-paint': ['warn', { maxNumericValue: ${{ matrix.device == 'mobile' && '3000' || '1500' }} }],
                  'largest-contentful-paint': ['warn', { maxNumericValue: ${{ matrix.device == 'mobile' && '4000' || '2500' }} }],
                  'interactive': ['warn', { maxNumericValue: ${{ matrix.device == 'mobile' && '5000' || '3500' }} }],
                  'cumulative-layout-shift': ['warn', { maxNumericValue: 0.15 }],
                  'total-blocking-time': ['warn', { maxNumericValue: ${{ matrix.device == 'mobile' && '600' || '300' }} }]
                }
              },
              upload: {
                target: 'temporary-public-storage'
              }
            }
          };
          EOF

          # Run Lighthouse
          lhci autorun --config=./lighthouserc.js || {
            echo "⚠️ Performance thresholds not met" | tee -a perf-report.txt
            # Don't fail the job for performance warnings
            true
          }

          # Extract key metrics
          if [ -f .lighthouseci/assertion-results.json ]; then
            echo "Performance Metrics:" | tee -a perf-report.txt
            cat .lighthouseci/assertion-results.json | jq -r '
              to_entries[] |
              .value[] |
              select(.auditProperty == "numericValue") |
              "\(.auditId): \(.actual)ms"
            ' | tee -a perf-report.txt
          fi

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-monitor-${{ matrix.environment }}-${{ matrix.device }}-${{ github.run_id }}
          path: |
            perf-report.txt
            .lighthouseci/
          retention-days: 7

  # ==========================================
  # Uptime Monitoring Integration
  # ==========================================

  uptime-check:
    name: Uptime Status Check
    runs-on: ubuntu-latest
    needs: [health-check]
    if: always()

    steps:
      - name: External uptime verification
        run: |
          echo "=== External Uptime Verification ===" | tee uptime-report.txt
          echo "Timestamp: $(date)" | tee -a uptime-report.txt
          echo "" | tee -a uptime-report.txt

          # Test from multiple locations using external services
          locations=("us-east" "us-west" "eu-central" "asia-pacific")

          for location in "${locations[@]}"; do
            echo "Testing from $location..." | tee -a uptime-report.txt
            
            # Simulate different geographic access patterns
            response_time=$(curl -w "%{time_total}" -s -o /dev/null \
              -H "CF-IPCountry: $(echo $location | cut -d'-' -f1 | tr '[:lower:]' '[:upper:]')" \
              "https://okaeri-resort.vercel.app")
            
            if [ $? -eq 0 ]; then
              echo "✅ $location: ${response_time}s" | tee -a uptime-report.txt
            else
              echo "❌ $location: Failed" | tee -a uptime-report.txt
            fi
          done

      # Webhook notification for critical failures
      - name: Send alerts for critical failures
        if: needs.health-check.result == 'failure'
        run: |
          echo "Critical health check failure detected!"

          # Send webhook notification (implement with your monitoring service)
          # Example: Slack webhook
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"text":"🚨 CRITICAL: Okaeri Resort System health check failed! <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"}' \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi

          # Example: Discord webhook
          if [ -n "${{ secrets.DISCORD_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data '{"content":"🚨 **CRITICAL ALERT**: Okaeri Resort System health check failed!\n\n🔗 [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"}' \
              "${{ secrets.DISCORD_WEBHOOK_URL }}"
          fi

      - name: Upload uptime results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uptime-check-${{ github.run_id }}
          path: uptime-report.txt
          retention-days: 7

  # ==========================================
  # Monitoring Summary
  # ==========================================

  monitoring-summary:
    name: Monitoring Summary
    runs-on: ubuntu-latest
    needs: [health-check, performance-monitor, uptime-check]
    if: always()

    steps:
      - name: Generate monitoring dashboard
        run: |
          echo "# 📊 System Monitoring Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Monitoring Run**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Health Check Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY

          # Production health status
          prod_status="${{ needs.health-check.result }}"
          if [ "$prod_status" = "success" ]; then
            echo "| Production | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Production | ❌ Issues Detected |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Performance Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          perf_status="${{ needs.performance-monitor.result }}"
          if [ "$perf_status" = "success" ]; then
            echo "✅ Performance within acceptable thresholds" >> $GITHUB_STEP_SUMMARY
          elif [ "$perf_status" = "failure" ]; then
            echo "❌ Performance issues detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Performance monitoring skipped" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Quick Actions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 [View detailed reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- 📈 [Performance trends](https://vercel.com/analytics)" >> $GITHUB_STEP_SUMMARY
          echo "- ⚡ [Speed insights](https://vercel.com/speed-insights)" >> $GITHUB_STEP_SUMMARY
          echo "- 🛠️ [Vercel dashboard](https://vercel.com/dashboard)" >> $GITHUB_STEP_SUMMARY

          if [ "$prod_status" != "success" ] || [ "$perf_status" = "failure" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ⚠️ Action Required" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "System monitoring detected issues that require attention:" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the detailed reports in workflow artifacts" >> $GITHUB_STEP_SUMMARY
            echo "2. Check Vercel deployment logs" >> $GITHUB_STEP_SUMMARY
            echo "3. Verify database connectivity" >> $GITHUB_STEP_SUMMARY
            echo "4. Consider scaling resources if needed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Store monitoring metrics
        run: |
          # Create metrics file for historical tracking
          echo "{
            \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"health_check\": \"${{ needs.health-check.result }}\",
            \"performance_monitor\": \"${{ needs.performance-monitor.result }}\",
            \"uptime_check\": \"${{ needs.uptime-check.result }}\",
            \"workflow_run\": \"${{ github.run_id }}\"
          }" > monitoring-metrics.json

      - name: Upload monitoring metrics
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-metrics-${{ github.run_id }}
          path: monitoring-metrics.json
          retention-days: 30
