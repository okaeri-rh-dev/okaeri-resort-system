name: Security Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    paths:
      - "vercel.json"
      - "**/*.ts"
      - "**/*.tsx"
      - "docs/security/**"
      - ".github/workflows/security-*.yml"

jobs:
  validate-csp:
    name: Validate CSP Headers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CSP Headers
        run: |
          echo "🔍 Validating Content Security Policy configuration..."
          echo "================================================"

          # Check for unsafe-eval in production
          if grep -q "'unsafe-eval'" vercel.json; then
            echo "::error::❌ CRITICAL: 'unsafe-eval' found in CSP headers!"
            echo "Remove 'unsafe-eval' from production CSP configuration in vercel.json"
            echo "This directive allows arbitrary code execution and is a major security risk."
            exit 1
          fi

          # Check for unsafe-inline in script-src
          if grep -q "script-src[^;]*'unsafe-inline'" vercel.json; then
            echo "::warning::⚠️ WARNING: 'unsafe-inline' found in script-src"
            echo "Consider using nonces or hashes instead of 'unsafe-inline' for better security."
            echo "See docs/implementation/CI_CD_PIPELINE_GUIDE.md for CSP nonce implementation."
          fi

          # Check for unsafe-inline in style-src (warning only as it's less critical)
          if grep -q "style-src[^;]*'unsafe-inline'" vercel.json; then
            echo "::warning::⚠️ NOTICE: 'unsafe-inline' found in style-src"
            echo "While less critical than script-src, consider using nonces for styles too."
          fi

          # Verify required security directives
          echo ""
          echo "🔍 Checking for required CSP directives..."

          MISSING_DIRECTIVES=()

          if ! grep -q "frame-ancestors" vercel.json; then
            MISSING_DIRECTIVES+=("frame-ancestors")
          fi

          if ! grep -q "object-src" vercel.json; then
            MISSING_DIRECTIVES+=("object-src")
          fi

          if ! grep -q "base-uri" vercel.json; then
            MISSING_DIRECTIVES+=("base-uri")
          fi

          if ! grep -q "form-action" vercel.json; then
            MISSING_DIRECTIVES+=("form-action")
          fi

          if ! grep -q "upgrade-insecure-requests" vercel.json; then
            MISSING_DIRECTIVES+=("upgrade-insecure-requests")
          fi

          if [ ${#MISSING_DIRECTIVES[@]} -gt 0 ]; then
            echo "::error::❌ Missing required CSP directives: ${MISSING_DIRECTIVES[*]}"
            echo "Add these directives to strengthen your CSP configuration."
            exit 1
          fi

          echo "✅ All required CSP directives are present"
          echo ""
          echo "🔍 Checking other security headers..."

          # Check for other important security headers
          REQUIRED_HEADERS=(
            "X-Content-Type-Options"
            "X-Frame-Options"
            "Strict-Transport-Security"
            "Permissions-Policy"
            "Referrer-Policy"
          )

          MISSING_HEADERS=()

          for header in "${REQUIRED_HEADERS[@]}"; do
            if ! grep -q "\"key\": \"$header\"" vercel.json; then
              MISSING_HEADERS+=("$header")
            fi
          done

          if [ ${#MISSING_HEADERS[@]} -gt 0 ]; then
            echo "::warning::⚠️ Missing recommended security headers: ${MISSING_HEADERS[*]}"
            echo "Consider adding these headers for defense-in-depth security."
          else
            echo "✅ All recommended security headers are configured"
          fi

          echo ""
          echo "================================================"
          echo "✅ CSP validation completed successfully!"
          echo ""
          echo "Security Score Summary:"
          echo "- No 'unsafe-eval' directive ✅"
          echo "- Required CSP directives present ✅"
          echo "- Security headers configured ✅"
          echo ""
          echo "For more information, see:"
          echo "- docs/security/SECURITY_CHECKLIST.md"
          echo "- docs/implementation/CI_CD_PIPELINE_GUIDE.md"

      - name: Check Documentation Consistency
        run: |
          echo "🔍 Checking security documentation for unsafe examples..."

          # Check if documentation contains unsafe-eval examples without warnings
          DOCS_WITH_UNSAFE=$(grep -l "'unsafe-eval'" docs/**/*.md 2>/dev/null || true)

          if [ ! -z "$DOCS_WITH_UNSAFE" ]; then
            echo "📚 Files mentioning 'unsafe-eval':"
            for file in $DOCS_WITH_UNSAFE; do
              echo "  - $file"
              # Check if the file has a warning about not using it in production
              if ! grep -q -i "warning\|never\|do not use\|development only" "$file"; then
                echo "::warning::File $file mentions 'unsafe-eval' without clear warning"
              fi
            done
          fi

          echo "✅ Documentation check completed"

  owasp-compliance:
    name: OWASP Compliance Check
    runs-on: ubuntu-latest
    needs: validate-csp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: OWASP Security Checklist
        run: |
          echo "🛡️ Running OWASP Top 10 compliance checks..."
          echo "================================================"

          # A05: Security Misconfiguration - Check for unsafe CSP
          echo "📋 A05 - Security Misconfiguration"

          ISSUES=0

          # Check for development/debug settings in production config
          if grep -q "NODE_ENV.*development" vercel.json; then
            echo "::warning::Development mode detected in production config"
            ((ISSUES++))
          fi

          # Check for verbose error messages
          if grep -q "DEBUG\|VERBOSE" vercel.json; then
            echo "::warning::Debug/verbose settings detected in production config"
            ((ISSUES++))
          fi

          # Check for default or weak configurations
          if grep -q "password.*123\|secret.*test\|key.*demo" vercel.json .env.example 2>/dev/null; then
            echo "::error::Weak or default credentials detected!"
            exit 1
          fi

          if [ $ISSUES -eq 0 ]; then
            echo "✅ A05 - Security Misconfiguration: PASS"
          else
            echo "⚠️ A05 - Security Misconfiguration: $ISSUES warnings"
          fi

          echo ""
          echo "📋 A02 - Cryptographic Failures"

          # Check for HTTPS enforcement
          if grep -q "upgrade-insecure-requests" vercel.json; then
            echo "✅ HTTPS enforcement configured"
          else
            echo "::warning::Consider adding upgrade-insecure-requests to CSP"
          fi

          # Check for HSTS
          if grep -q "Strict-Transport-Security" vercel.json; then
            echo "✅ HSTS configured"
          else
            echo "::error::HSTS not configured - required for production!"
            exit 1
          fi

          echo ""
          echo "================================================"
          echo "🛡️ OWASP compliance check completed"

  security-score:
    name: Calculate Security Score
    runs-on: ubuntu-latest
    needs: [validate-csp, owasp-compliance]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Security Score
        run: |
          echo "📊 Calculating Security Score..."
          echo "================================"

          SCORE=100
          DEDUCTIONS=""

          # Check CSP strength
          if grep -q "'unsafe-inline'" vercel.json; then
            SCORE=$((SCORE - 10))
            DEDUCTIONS="${DEDUCTIONS}\n  -10: Uses 'unsafe-inline' in CSP"
          fi

          if grep -q "'unsafe-eval'" vercel.json; then
            SCORE=$((SCORE - 25))
            DEDUCTIONS="${DEDUCTIONS}\n  -25: Uses 'unsafe-eval' in CSP (CRITICAL)"
          fi

          # Check security headers
          HEADERS=("X-Content-Type-Options" "X-Frame-Options" "Strict-Transport-Security" "Permissions-Policy" "Referrer-Policy")

          for header in "${HEADERS[@]}"; do
            if ! grep -q "\"$header\"" vercel.json; then
              SCORE=$((SCORE - 5))
              DEDUCTIONS="${DEDUCTIONS}\n  -5: Missing $header"
            fi
          done

          # Display score
          echo "Security Score: ${SCORE}/100"

          if [ ! -z "$DEDUCTIONS" ]; then
            echo -e "\nDeductions:${DEDUCTIONS}"
          fi

          echo ""

          # Grade calculation
          if [ $SCORE -ge 95 ]; then
            GRADE="A+"
            COLOR="green"
          elif [ $SCORE -ge 90 ]; then
            GRADE="A"
            COLOR="green"
          elif [ $SCORE -ge 85 ]; then
            GRADE="B+"
            COLOR="yellow"
          elif [ $SCORE -ge 80 ]; then
            GRADE="B"
            COLOR="yellow"
          elif [ $SCORE -ge 75 ]; then
            GRADE="C"
            COLOR="orange"
          else
            GRADE="F"
            COLOR="red"
          fi

          echo "Security Grade: $GRADE"
          echo ""

          # Create badge (if needed for README)
          echo "::notice::Security Score: ${SCORE}/100 (Grade: $GRADE)"

          # Fail if score is too low
          if [ $SCORE -lt 75 ]; then
            echo "::error::Security score too low! Minimum required: 75/100"
            exit 1
          fi

          echo "================================"
          echo "✅ Security validation passed!"
