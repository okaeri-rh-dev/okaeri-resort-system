name: infra-health
on:
  push:
    branches: [main]
    # Docs-only pushes change nothing that runs; skipping them saves Actions minutes.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # No paths filter here: e2e is a required check, and a workflow that never starts leaves
  # the PR waiting. e2e-scope skips the e2e job instead; a skipped job passes the check.
  pull_request:
  schedule:
    - cron: "0 22 * * 0" # weekly, Sun 22:00 UTC — catches drift during idle weeks
  workflow_dispatch:

concurrency:
  group: infra-health-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint + unit already run in the deploy quality gate on every push; keep this
  # copy for the weekly and manual runs only.
  health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings 0
      - name: Migration filename lint
        run: |
          bad=$(ls supabase/migrations | grep -Ev '^[0-9]{14}_' || true)
          if [ -n "$bad" ]; then
            echo "::error::Non-standard migration filenames (supabase migration up will fail):"
            echo "$bad"
            exit 1
          fi
      - name: Unit tests (non-DB)
        run: npx vitest run --exclude 'src/__tests__/database/**' --exclude '__tests__/database/**' --exclude 'src/__tests__/performance/multi-unit-availability.test.ts'

  # Weekly prod drift: prod's public-schema catalog vs the migrations (scripts/drift-check.sh).
  # Not on push: a migration committed before `supabase db push` would fail it every time.
  prod-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Start local Supabase (applies all migrations)
        run: supabase start
      - name: Compare prod catalog with the migrations
        env:
          SUPABASE_DRIFT_DB_URL: ${{ secrets.SUPABASE_DRIFT_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DRIFT_DB_URL" ]; then
            echo "::error::SUPABASE_DRIFT_DB_URL secret is not set (drift_reader role, session pooler URL)"
            exit 1
          fi
          sh scripts/drift-check.sh

  # ── Stage 2: DB + E2E against a fresh local Supabase stack ──
  # Enabled 2026-07-05 after the migration-filename repair and E2E root-cause
  # fixes (loopback exemption for IP auto-blocking, Playwright global-setup
  # user seeding, viewport-aware DashboardPage).
  # A PR runs e2e only when it changes something the app, the DB or the tests run on.
  e2e-scope:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runtime='^(src|e2e|supabase|functions|scripts|public)/|^package(-lock)?\.json$|^index\.html$|^tsconfig[^/]*\.json$|^[^/]*\.config\.[cm]?[jt]s$|^wrangler\.|^\.nvmrc$|^\.github/workflows/infra-health\.yml$'
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if echo "$changed" | grep -Eq "$runtime"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app, DB or test files changed; skipping e2e."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: latest # deliberately unpinned: CLI-upgrade breakage should fail HERE, not mid-session
      - run: npm ci
      - name: Start local Supabase (applies all migrations — fails on bad history)
        run: supabase start
      # Machine-readable env extraction — never regex the human `supabase status`
      # output (see CLAUDE.md "Supabase CLI output parsing").
      - name: Provision env files from `supabase status -o env`
        run: |
          supabase status -o env | grep -E '^[A-Z0-9_]+=' > /tmp/sb.env
          set -a; . /tmp/sb.env; set +a
          # Vite app + vitest DB tests + scripts/e2e seed/cleanup
          cat > .env.local <<EOF
          VITE_SUPABASE_URL=$API_URL
          VITE_SUPABASE_ANON_KEY=$ANON_KEY
          VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA
          VITE_SKIP_TURNSTILE=true
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          TEST_SUPABASE_URL=$API_URL
          TEST_SUPABASE_ANON_KEY=$ANON_KEY
          TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF
          # Cloudflare Pages functions via `wrangler pages dev` (dev:cf).
          # ENVIRONMENT=development makes verifyTurnstile a no-op server-side.
          cat > .dev.vars <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          SUPABASE_JWT_SECRET=$JWT_SECRET
          ENVIRONMENT=development
          APP_VERSION=ci
          EOF
      - name: DB tests
        run: npx vitest run src/__tests__/database __tests__/database src/__tests__/performance/multi-unit-availability.test.ts
      # Non-blocking for now: the CLI is unpinned, so generator output can change between versions.
      # If only the CLI changed: upgrade the local CLI, run `npm run gen:types`, and commit the result.
      - name: Type drift (database.generated.ts matches the migrations)
        continue-on-error: true
        run: npm run gen:types && git diff --exit-code src/types/database.generated.ts
      # Non-blocking until the SQL-function errors in the guardrails plan are fixed.
      - name: SQL function lint (plpgsql_check)
        continue-on-error: true
        run: |
          set -a; . /tmp/sb.env; set +a
          supabase db lint --db-url "$DB_URL" --level error --fail-on error
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E (seed -> playwright -> cleanup)
        run: npm run test:e2e:hooked
        env:
          # Local-only users from supabase/seed.sql
          TEST_ADMIN_EMAIL: admin@okaeri.test
          TEST_ADMIN_PASSWORD: test-password
          TEST_OWNER_EMAIL: owner@okaeri.test
          TEST_OWNER_PASSWORD: test-password
          TEST_MANAGER_EMAIL: manager@okaeri.test
          TEST_MANAGER_PASSWORD: test-password
          TEST_STAFF_EMAIL: staff@okaeri.test
          TEST_STAFF_PASSWORD: test-password
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
