name: Security Scan

# Not on push: the deploy quality gate already runs npm audit and the unit
# suite (which includes these tests) on every push to main.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # Weekly, Monday 2 AM UTC
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Run security tests
        run: npm run test:security
        continue-on-error: true

      - name: Check for sensitive data
        run: |
          # Check for potential secrets in code
          grep -r -E "(api[_-]?key|secret|password|token)" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules --exclude-dir=dist . || true

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report
          path: test-results/

  xss-prevention:
    name: XSS Prevention Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run XSS prevention tests
        run: npm run test:run -- -t "XSS"

      - name: Check DOMPurify usage
        run: |
          echo "Checking for proper DOMPurify usage..."
          grep -r "dangerouslySetInnerHTML" --include="*.tsx" --exclude-dir=node_modules . || echo "✅ No dangerouslySetInnerHTML found"
          grep -r "DOMPurify.sanitize" --include="*.ts" --include="*.tsx" --exclude-dir=node_modules . | wc -l
