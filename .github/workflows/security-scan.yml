name: Security Scan

on:
  schedule:
    # Run daily security scans at 3 AM UTC (11 AM Philippine time GMT+8)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - "package*.json"
      - "src/**"
      - "api/**"
      - ".github/workflows/security-scan.yml"
  pull_request:
    paths:
      - "package*.json"
      - "src/**"
      - "api/**"

env:
  NODE_VERSION: "20"

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run security linting
        run: npm run lint -- --quiet
        continue-on-error: true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Run type check
        run: npm run type-check

      - name: Scan for known vulnerabilities
        uses: github/super-linter/slim@v5
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_TYPESCRIPT_STANDARD: true
          VALIDATE_JSON: true
          LOG_LEVEL: WARN

      - name: Security scan summary
        if: always()
        run: |
          echo "## Security Scan Results 🔒" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency audit completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret scanning completed" >> $GITHUB_STEP_SUMMARY  
          echo "- ✅ Type checking completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Code quality analysis completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For detailed results, check the individual step outputs above." >> $GITHUB_STEP_SUMMARY
