name: Lighthouse CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      url:
        description: "URL to test (optional)"
        required: false
        type: string

env:
  NODE_VERSION: "20.x"

jobs:
  lighthouse:
    name: Run Lighthouse CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test different form factors
        device: ["mobile", "desktop"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for LHCI

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm install -g @lhci/cli@0.13.x

      - name: Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL || 'ws://localhost:3000' }}

      - name: Configure Lighthouse for ${{ matrix.device }}
        run: |
          if [ "${{ matrix.device }}" = "desktop" ]; then
            # Update config for desktop
            sed -i "s/preset: 'mobile'/preset: 'desktop'/g" lighthouserc.js
            sed -i "s/formFactor: 'mobile'/formFactor: 'desktop'/g" lighthouserc.js
          fi

      - name: Run Lighthouse CI
        run: |
          if [ -n "${{ github.event.inputs.url }}" ]; then
            # Test custom URL if provided
            lhci autorun --collect.url="${{ github.event.inputs.url }}"
          else
            # Run standard tests
            lhci autorun
          fi
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LHCI_SERVER_URL: ${{ secrets.LHCI_SERVER_URL }}
          LHCI_BUILD_TOKEN: ${{ secrets.LHCI_BUILD_TOKEN }}

      - name: Generate Lighthouse report
        if: always()
        run: |
          mkdir -p lighthouse-reports
          cp .lighthouseci/*.html lighthouse-reports/ 2>/dev/null || true
          cp .lighthouseci/*.json lighthouse-reports/ 2>/dev/null || true

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ matrix.device }}-${{ github.sha }}
          path: lighthouse-reports/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            try {
              // Read assertion results
              const assertionResults = JSON.parse(
                fs.readFileSync('.lighthouseci/assertion-results.json', 'utf8')
              );
              
              // Format results for comment
              let comment = '## 🔦 Lighthouse CI Results (${{ matrix.device }})\n\n';
              
              for (const [url, results] of Object.entries(assertionResults)) {
                const shortUrl = url.replace('http://localhost:4173', '');
                comment += `### ${shortUrl}\n\n`;
                
                // Extract scores
                const perfScore = results.find(r => r.auditId === 'categories:performance');
                const a11yScore = results.find(r => r.auditId === 'categories:accessibility');
                const bpScore = results.find(r => r.auditId === 'categories:best-practices');
                const seoScore = results.find(r => r.auditId === 'categories:seo');
                
                if (perfScore) {
                  const score = Math.round(perfScore.actual * 100);
                  const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';
                  comment += `${emoji} **Performance:** ${score}/100\n`;
                }
                
                if (a11yScore) {
                  const score = Math.round(a11yScore.actual * 100);
                  const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';
                  comment += `${emoji} **Accessibility:** ${score}/100\n`;
                }
                
                if (bpScore) {
                  const score = Math.round(bpScore.actual * 100);
                  const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';
                  comment += `${emoji} **Best Practices:** ${score}/100\n`;
                }
                
                if (seoScore) {
                  const score = Math.round(seoScore.actual * 100);
                  const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';
                  comment += `${emoji} **SEO:** ${score}/100\n`;
                }
                
                comment += '\n';
                
                // Show any failures
                const failures = results.filter(r => r.level === 'error');
                if (failures.length > 0) {
                  comment += '#### ❌ Failed Assertions:\n';
                  failures.forEach(f => {
                    comment += `- **${f.auditId}:** ${f.actual} (expected ${f.operator} ${f.expected})\n`;
                  });
                  comment += '\n';
                }
                
                // Show warnings
                const warnings = results.filter(r => r.level === 'warn');
                if (warnings.length > 0) {
                  comment += '#### ⚠️ Warnings:\n';
                  warnings.slice(0, 5).forEach(w => {
                    comment += `- **${w.auditId}:** ${w.actual}\n`;
                  });
                  if (warnings.length > 5) {
                    comment += `- ...and ${warnings.length - 5} more warnings\n`;
                  }
                  comment += '\n';
                }
              }
              
              comment += '\n---\n';
              comment += `View full report in [GitHub Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              
              // Post or update comment
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(comment => 
                comment.user.type === 'Bot' && 
                comment.body.includes('Lighthouse CI Results')
              );
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: comment,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: comment,
                });
              }
            } catch (error) {
              console.error('Error posting Lighthouse results:', error);
            }

      - name: Validate performance budgets
        run: |
          # Check if any assertions failed
          if [ -f .lighthouseci/assertion-results.json ]; then
            failures=$(cat .lighthouseci/assertion-results.json | jq '[.[] | .[] | select(.level == "error")] | length')
            if [ "$failures" -gt 0 ]; then
              echo "❌ Lighthouse CI found $failures assertion failures"
              cat .lighthouseci/assertion-results.json | jq '.[] | .[] | select(.level == "error")'
              exit 1
            else
              echo "✅ All Lighthouse assertions passed!"
            fi
          fi

  lighthouse-summary:
    name: Lighthouse Summary
    needs: lighthouse
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lighthouse-reports-*
          path: all-reports/

      - name: Create summary
        run: |
          echo "# Lighthouse CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for mobile and desktop results
          if [ -d "all-reports/lighthouse-reports-mobile-${{ github.sha }}" ]; then
            echo "✅ Mobile tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Mobile tests failed or incomplete" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -d "all-reports/lighthouse-reports-desktop-${{ github.sha }}" ]; then
            echo "✅ Desktop tests completed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Desktop tests failed or incomplete" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Performance Targets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Score | ≥95 | 🎯 |" >> $GITHUB_STEP_SUMMARY
          echo "| First Contentful Paint | <1.5s | 🎯 |" >> $GITHUB_STEP_SUMMARY
          echo "| Largest Contentful Paint | <2.5s | 🎯 |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Blocking Time | <300ms | 🎯 |" >> $GITHUB_STEP_SUMMARY
          echo "| Cumulative Layout Shift | <0.1 | 🎯 |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle Size | <1.6MB | 🎯 |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "View detailed reports in the [Actions artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
