name = "okaeri-resort-system"
compatibility_date = "2025-09-29"
pages_build_output_dir = "dist"

# Production environment configuration
[env.production]

# KV Namespace for rate limiting
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "98171af1c3bd4f718ff86c1f966c64a5"

# Production environment variables
[env.production.vars]
ENVIRONMENT = "production"
# SUPABASE_URL and SUPABASE_ANON_KEY should be set as secrets via:
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_ANON_KEY
# npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# npx wrangler secret put TURNSTILE_SECRET_KEY
# npx wrangler secret put RESEND_API_KEY

# Preview environment configuration
[env.preview]

# KV Namespace for rate limiting (sharing production namespace)
[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "98171af1c3bd4f718ff86c1f966c64a5"

# Preview environment variables
[env.preview.vars]
ENVIRONMENT = "preview"
# SUPABASE_URL and SUPABASE_ANON_KEY should be set as secrets for preview too

# Scheduled triggers for cleanup cron job
[triggers]
crons = ["0 * * * *"]  # Run hourly