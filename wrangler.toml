name = "okaeri-resort"
compatibility_date = "2025-09-29"
pages_build_output_dir = "dist"

# KV Namespaces (available in all environments including local dev)
# For local development, Miniflare creates an in-memory KV store
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "local-rate-limit-kv"

# Development environment configuration
[dev]
port = 8788
local_protocol = "http"

# Production environment configuration
[env.production]

# KV Namespace for rate limiting
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "98171af1c3bd4f718ff86c1f966c64a5"

# KV Namespace for blocked IPs (optional - for DDoS protection)
# NOTE: Commented out because this feature is not implemented yet
# Uncomment when implementing IP blocking functionality
# [[env.production.kv_namespaces]]
# binding = "BLOCKED_IPS_KV"
# id = "TO_BE_CREATED"  # Create via: npx wrangler kv namespace create "BLOCKED_IPS_KV"

# Production environment variables
[env.production.vars]
ENVIRONMENT = "production"
# Secrets should be set via Cloudflare Pages dashboard or wrangler:
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_ANON_KEY
# npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# npx wrangler secret put TURNSTILE_SECRET_KEY
# npx wrangler secret put RESEND_API_KEY
# npx wrangler secret put CRON_SECRET  # For GitHub Actions scheduled cleanup

# Preview environment configuration
[env.preview]

# KV Namespace for rate limiting (sharing production namespace)
[[env.preview.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "98171af1c3bd4f718ff86c1f966c64a5"

# KV Namespace for blocked IPs (optional - for DDoS protection)
# NOTE: Commented out because this feature is not implemented yet
# Uncomment when implementing IP blocking functionality
# [[env.preview.kv_namespaces]]
# binding = "BLOCKED_IPS_KV"
# id = "TO_BE_CREATED"  # Create via: npx wrangler kv namespace create "BLOCKED_IPS_KV" --preview

# Preview environment variables
[env.preview.vars]
ENVIRONMENT = "preview"
# SUPABASE_URL and SUPABASE_ANON_KEY should be set as secrets for preview too

# =============================================================================
# LOCAL DEVELOPMENT CONFIGURATION
# =============================================================================
# NOTE: The [env.development] section below is COMMENTED OUT because:
# 1. Cloudflare Pages only supports "preview" and "production" named environments
# 2. Local development works perfectly without it using:
#    - Root-level configuration (lines 7-14)
#    - [dev] section for local server settings
#    - .dev.vars file for environment variables and secrets
# 3. Miniflare automatically creates in-memory KV stores for local development
#
# If you're deploying to Cloudflare Workers (not Pages), you can uncomment this.
# For Pages deployments, keep this commented to avoid deployment errors.
# =============================================================================

# [env.development]
#
# # KV Namespace for rate limiting (local development)
# [[env.development.kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# # This will create a local KV namespace for development
# preview_id = "local-rate-limit-kv"
#
# # Local development environment variables
# [env.development.vars]
# ENVIRONMENT = "development"
# # Note: Secrets should be in .dev.vars file

# =============================================================================
# CRON TRIGGERS - MIGRATED TO GITHUB ACTIONS
# =============================================================================
# NOTE: Cloudflare Pages does NOT support [triggers] configuration.
# Cron jobs have been migrated to GitHub Actions scheduled workflows.
#
# See: .github/workflows/scheduled-cleanup.yml
# HTTP Endpoints: /api/cron/cleanup-idempotency, /api/cron/cleanup-payment-proofs
#
# Original schedules (now in GitHub Actions):
# - Daily 2:00 AM UTC: Cleanup expired idempotency keys
# - Weekly Sunday 3:00 AM UTC: Cleanup expired payment proofs
#
# To run manually: GitHub Actions > Scheduled Cleanup Tasks > Run workflow
# =============================================================================

# [triggers]  # NOT SUPPORTED by Cloudflare Pages
# crons = [
#   "0 2 * * *",   # Daily 2:00 AM UTC: Cleanup expired idempotency keys (48+ hours old)
#   "0 3 * * 0"    # Weekly Sunday 3:00 AM UTC: Cleanup expired payment proofs (90+ days completed, 30+ days cancelled)
# ]

# =============================================================================
# Cron Monitoring & Alerting (GitHub Actions)
# =============================================================================
# Monitor scheduled cleanup execution via:
# 1. GitHub Actions: Repository > Actions > Scheduled Cleanup Tasks
# 2. Cloudflare Logs: Workers & Pages > Your Project > Functions > Logs
# 3. Manual trigger: GitHub Actions > Scheduled Cleanup Tasks > Run workflow
#
# Alert Thresholds (logged in cleanup functions):
# - Idempotency cleanup: >1000 keys deleted (investigate double-booking attempts)
# - Payment proof cleanup: >50 files deleted per week (investigate bulk cancellations)
#
# Setup Requirements:
# 1. GitHub Secret: CRON_SECRET (same value as Cloudflare Pages environment variable)
# 2. Cloudflare Secret: CRON_SECRET (set via dashboard or wrangler secret put)
#
# Troubleshooting:
# - HTTP 401: Check CRON_SECRET matches in both GitHub and Cloudflare
# - HTTP 500: Check Supabase credentials (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)
# - Function not found: Verify migration 023 applied to database
# =============================================================================
