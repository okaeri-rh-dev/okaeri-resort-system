<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <title>Okaeri Rest House Management System</title>
    <meta
      name="description"
      content="Comprehensive resort management system for Philippine businesses. Handle bookings, guests, payments, and operations efficiently."
    />
    <meta
      name="keywords"
      content="resort management, booking system, philippine resort, hospitality software, hotel management, okaeri resort"
    />
    <meta name="author" content="Okaeri Rest House" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Okaeri Rest House Management System" />
    <meta
      property="og:description"
      content="Professional resort operations platform for Philippine businesses"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Okaeri Rest House" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Okaeri Rest House Management System" />
    <meta name="twitter:description" content="Professional resort operations platform" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Okaeri" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Theme Color: hand-synced copies of --background (DESIGN.md) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F1EC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1C1816" />

    <!-- Apply the saved theme before first paint; useUIStore takes over after load -->
    <script>
      (function () {
        var theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
        } catch (_error) {}
        var dark =
          theme === "dark" ||
          (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
      })();
    </script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Body font, so text doesn't wait on the stylesheet to discover it. Vite rewrites this to
         the same hashed file the @font-face in src/index.css uses; crossorigin is required for
         the preload to be reused. -->
    <link
      rel="preload"
      href="/node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Styles -->
    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Splash until React's first render replaces it -->
      <div style="display: grid; min-height: 100dvh; place-items: center">
        <svg
          viewBox="16 124 480 236"
          role="img"
          aria-label="Okaeri Rest House"
          style="width: min(60vw, 240px)"
        >
          <use href="/logo.svg#logo" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
