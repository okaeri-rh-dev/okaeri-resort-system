# PHASE 4.5 DAY 6: Multi-Project Isolation Stress Test
# Target: Multiple resort properties with concurrent operations
# Validate: 100% data isolation maintained
# Monitor: Cache performance and key isolation

config:
  target: "http://localhost:5173"
  phases:
    # Multi-tenant simulation ramp-up
    - duration: 60
      arrivalRate: 10
      name: "Multi-tenant warm-up"
    # Concurrent project operations
    - duration: 240
      arrivalRate: 25
      name: "Concurrent multi-tenant operations"
    # Peak isolation stress
    - duration: 120
      arrivalRate: 40
      name: "Peak isolation stress test"
    # Data consistency verification
    - duration: 60
      arrivalRate: 15
      name: "Data consistency check"

  variables:
    # Simulate 10 different resort properties
    projects:
      - {
          id: "okaeri-launion",
          name: "Okaeri La Union Resort",
          timezone: "Asia/Manila",
        }
      - {
          id: "baywatch-baguio",
          name: "Baywatch Baguio Hotel",
          timezone: "Asia/Manila",
        }
      - {
          id: "seaside-boracay",
          name: "Seaside Boracay Resort",
          timezone: "Asia/Manila",
        }
      - {
          id: "mountain-view-tagaytay",
          name: "Mountain View Tagaytay",
          timezone: "Asia/Manila",
        }
      - {
          id: "beach-club-palawan",
          name: "Beach Club Palawan",
          timezone: "Asia/Manila",
        }
      - {
          id: "sunrise-siargao",
          name: "Sunrise Siargao Resort",
          timezone: "Asia/Manila",
        }
      - {
          id: "clifftop-bataan",
          name: "Clifftop Bataan Hotel",
          timezone: "Asia/Manila",
        }
      - {
          id: "riverside-laguna",
          name: "Riverside Laguna Resort",
          timezone: "Asia/Manila",
        }
      - {
          id: "hilltop-bohol",
          name: "Hilltop Bohol Resort",
          timezone: "Asia/Manila",
        }
      - {
          id: "oceanview-cebu",
          name: "Ocean View Cebu Hotel",
          timezone: "Asia/Manila",
        }

    # Different user roles per project
    user_roles:
      - "manager"
      - "receptionist"
      - "finance"
      - "maintenance"
      - "housekeeping"

    # Various operation types for isolation testing
    operations:
      - "booking_create"
      - "booking_modify"
      - "payment_process"
      - "income_record"
      - "expense_track"
      - "report_generate"

  plugins:
    metrics-by-endpoint: {}
    expect: {}

  ensure:
    # Critical: Data isolation must be 100%
    - http.codes.403: 0 # No unauthorized access
    - http.codes.200: 90 # High success rate for authorized operations
    - http.response_time.p95: 2000 # Maintain performance under isolation load

scenarios:
  - name: "Cross-Project Data Isolation Verification"
    weight: 30
    flow:
      # Login to specific project
      - function: "selectProject"
      - post:
          url: "/api/auth/login"
          json:
            email: "{{ user_role }}-{{ project_id }}@{{ project_domain }}"
            password: "Test123!"
          capture:
            - json: "$.token"
              as: "auth_token"
            - json: "$.user.project_id"
              as: "user_project_id"
          expect:
            - statusCode: 200

      # Attempt to access data from SAME project (should succeed)
      - get:
          url: "/api/booking/list"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          qs:
            project_id: "{{ user_project_id }}"
          expect:
            - statusCode: 200
            # Verify all returned data belongs to the correct project
            - json: "$[*].project_id"
              value: "{{ user_project_id }}"

      # Attempt to access data from DIFFERENT project (should fail or return empty)
      - function: "selectDifferentProject"
      - get:
          url: "/api/booking/list"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          qs:
            project_id: "{{ different_project_id }}"
          expect:
            # Should either be forbidden or return empty results
            - or:
                - statusCode: 403
                - and:
                    - statusCode: 200
                    - json: "$"
                      value: []

      # Verify financial data isolation
      - get:
          url: "/api/financial/summary"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          qs:
            project_id: "{{ different_project_id }}"
            start_date: "2025-09-01"
            end_date: "2025-09-30"
          expect:
            - or:
                - statusCode: 403
                - and:
                    - statusCode: 200
                    - json: "$.total_transactions"
                      value: 0

  - name: "Concurrent Project Operations"
    weight: 25
    flow:
      # Simulate high concurrent operations across all projects
      - function: "selectRandomProject"
      - post:
          url: "/api/auth/login"
          json:
            email: "load-test-{{ $randomString() }}@{{ project_domain }}"
            password: "Load123!"
          capture:
            - json: "$.token"
              as: "auth_token"
          expect:
            - statusCode: 200

      # Perform various operations simultaneously per project
      - parallel:
          # Booking operations
          - post:
              url: "/api/booking/create"
              headers:
                Authorization: "Bearer {{ auth_token }}"
              json:
                project_id: "{{ project_id }}"
                guest_name: "Load Test Guest {{ $randomString() }}"
                guest_email: "guest-{{ $randomString() }}@example.com"
                check_in: "2025-10-01"
                check_out: "2025-10-03"
                room_type: "standard"
                guests: "{{ $randomInt(1, 4) }}"
              expect:
                - statusCode: 201

          # Financial operations
          - post:
              url: "/api/financial/income"
              headers:
                Authorization: "Bearer {{ auth_token }}"
              json:
                project_id: "{{ project_id }}"
                transaction_type: "other"
                gross_amount: "{{ $randomInt(500, 3000) }}.00"
                income_category: "amenities"
                payment_method: "cash"
              expect:
                - statusCode: 201

          # Dashboard metrics (read-heavy operation)
          - get:
              url: "/api/dashboard/metrics"
              headers:
                Authorization: "Bearer {{ auth_token }}"
              qs:
                project_id: "{{ project_id }}"
                period: "week"
              expect:
                - statusCode: 200

  - name: "Cache Key Isolation Testing"
    weight: 20
    flow:
      - function: "selectRandomProject"
      - post:
          url: "/api/auth/login"
          json:
            email: "cache-test-{{ $randomString() }}@{{ project_domain }}"
            password: "Cache123!"
          capture:
            - json: "$.token"
              as: "auth_token"
          expect:
            - statusCode: 200

      # Generate cacheable requests for specific project
      - loop:
          - get:
              url: "/api/dashboard/metrics"
              headers:
                Authorization: "Bearer {{ auth_token }}"
              qs:
                project_id: "{{ project_id }}"
                period: "month"
                cache_buster: "{{ $randomString() }}"
              expect:
                - statusCode: 200
                # Verify cached data contains correct project_id
                - json: "$.project_id"
                  value: "{{ project_id }}"
        count: 5

      # Verify cache isolation with different projects
      - function: "selectDifferentProject"
      - get:
          url: "/api/dashboard/metrics"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          qs:
            project_id: "{{ different_project_id }}"
            period: "month"
          expect:
            - or:
                - statusCode: 403
                - and:
                    - statusCode: 200
                    - json: "$.project_id"
                      not: "{{ project_id }}" # Must be different from original

  - name: "Database Query Isolation Under Load"
    weight: 15
    flow:
      - function: "selectRandomProject"
      - post:
          url: "/api/auth/login"
          json:
            email: "db-test-{{ $randomString() }}@{{ project_domain }}"
            password: "DbTest123!"
          capture:
            - json: "$.token"
              as: "auth_token"
          expect:
            - statusCode: 200

      # Execute complex queries that must maintain project_id filtering
      - parallel:
          # Complex booking search
          - get:
              url: "/api/booking/search"
              headers:
                Authorization: "Bearer {{ auth_token }}"
              qs:
                project_id: "{{ project_id }}"
                status: "confirmed"
                check_in_start: "2025-09-01"
                check_in_end: "2025-12-31"
                limit: 100
              expect:
                - statusCode: 200
                # All results must belong to correct project
                - json: "$[*].project_id"
                  value: "{{ project_id }}"

          # Financial aggregation queries
          - get:
              url: "/api/financial/revenue-report"
              headers:
                Authorization: "Bearer {{ auth_token }}"
              qs:
                project_id: "{{ project_id }}"
                start_date: "2025-01-01"
                end_date: "2025-12-31"
                group_by: "month"
              expect:
                - statusCode: 200
                # Verify aggregation maintains project isolation
                - json: "$.project_id"
                  value: "{{ project_id }}"

          # User management within project
          - get:
              url: "/api/users/project-members"
              headers:
                Authorization: "Bearer {{ auth_token }}"
              qs:
                project_id: "{{ project_id }}"
              expect:
                - statusCode: 200
                # All users must belong to same project
                - json: "$[*].project_id"
                  value: "{{ project_id }}"

  - name: "Session Isolation and Security"
    weight: 10
    flow:
      # Test session token isolation between projects
      - function: "selectRandomProject"
      - post:
          url: "/api/auth/login"
          json:
            email: "security-{{ $randomString() }}@{{ project_domain }}"
            password: "Security123!"
          capture:
            - json: "$.token"
              as: "auth_token_project_a"
            - json: "$.user.project_id"
              as: "project_a_id"
          expect:
            - statusCode: 200

      # Get another project token
      - function: "selectDifferentProject"
      - post:
          url: "/api/auth/login"
          json:
            email: "security-{{ $randomString() }}@{{ different_project_domain }}"
            password: "Security123!"
          capture:
            - json: "$.token"
              as: "auth_token_project_b"
            - json: "$.user.project_id"
              as: "project_b_id"
          expect:
            - statusCode: 200

      # Verify token A cannot access project B data
      - get:
          url: "/api/dashboard/metrics"
          headers:
            Authorization: "Bearer {{ auth_token_project_a }}"
          qs:
            project_id: "{{ project_b_id }}"
          expect:
            - statusCode: 403

      # Verify token B cannot access project A data
      - get:
          url: "/api/dashboard/metrics"
          headers:
            Authorization: "Bearer {{ auth_token_project_b }}"
          qs:
            project_id: "{{ project_a_id }}"
          expect:
            - statusCode: 403

# Artillery.js functions for project selection
functions:
  selectProject: |
    const project = context.vars.projects[Math.floor(Math.random() * context.vars.projects.length)];
    context.vars.project_id = project.id;
    context.vars.project_name = project.name;
    context.vars.project_domain = project.id.replace(/-/g, '') + '.com';
    context.vars.user_role = context.vars.user_roles[Math.floor(Math.random() * context.vars.user_roles.length)];

  selectRandomProject: |
    const project = context.vars.projects[Math.floor(Math.random() * context.vars.projects.length)];
    context.vars.project_id = project.id;
    context.vars.project_name = project.name;
    context.vars.project_domain = project.id.replace(/-/g, '') + '.com';

  selectDifferentProject: |
    let different_project;
    do {
      different_project = context.vars.projects[Math.floor(Math.random() * context.vars.projects.length)];
    } while (different_project.id === context.vars.project_id);

    context.vars.different_project_id = different_project.id;
    context.vars.different_project_domain = different_project.id.replace(/-/g, '') + '.com';
