# PHASE 4.5 DAY 6: Payment Gateway Failover Testing
# Target: Test 4-gateway system under high load
# Validate: Exponential backoff retry mechanisms
# Monitor: Payment processing success rates

config:
  target: "http://localhost:5173"
  phases:
    # Gateway warm-up
    - duration: 60
      arrivalRate: 5
      name: "Gateway warm-up"
    # Normal payment load
    - duration: 120
      arrivalRate: 15
      name: "Normal payment processing"
    # Gateway failure simulation
    - duration: 180
      arrivalRate: 25
      name: "Gateway failure simulation"
    # Recovery testing
    - duration: 120
      arrivalRate: 20
      name: "Recovery and failover testing"

  variables:
    # Payment gateway configurations
    gateways:
      - {
          id: "PAYMONGO",
          name: "PayMongo",
          reliability: 0.95,
          methods: ["credit_card", "debit_card", "gcash"],
        }
      - {
          id: "GCASH",
          name: "GCash Direct",
          reliability: 0.98,
          methods: ["gcash"],
        }
      - {
          id: "DRAGONPAY",
          name: "DragonPay",
          reliability: 0.92,
          methods: ["bank_transfer", "over_the_counter"],
        }
      - {
          id: "BANK_TRANSFER",
          name: "Direct Bank Transfer",
          reliability: 0.88,
          methods: ["bank_transfer"],
        }

    # Payment scenarios with different amounts
    payment_scenarios:
      - { amount: "1250.00", description: "Small booking payment" }
      - { amount: "5500.75", description: "Standard room booking" }
      - { amount: "12800.50", description: "Premium suite booking" }
      - { amount: "25000.00", description: "Event package booking" }
      - { amount: "750.25", description: "Addon service payment" }

    # Customer data for payment testing
    customers:
      - { name: "Juan Cruz", email: "juan@example.com", phone: "+639171234567" }
      - {
          name: "Maria Santos",
          email: "maria@example.com",
          phone: "+639281234567",
        }
      - {
          name: "Jose Garcia",
          email: "jose@example.com",
          phone: "+639391234567",
        }
      - { name: "Ana Rivera", email: "ana@example.com", phone: "+639501234567" }

    project_ids:
      - "proj-001"
      - "proj-002"
      - "proj-003"

  plugins:
    metrics-by-endpoint: {}
    expect: {}

  ensure:
    # Payment processing must maintain high success rates even with gateway failures
    - http.codes.201: 85 # 85% payment success rate minimum (accounting for retries)
    - http.response_time.p95: 5000 # Allow up to 5s for retry mechanisms
    - http.response_time.p99: 10000 # Allow up to 10s for multiple retries

scenarios:
  - name: "Primary Gateway Processing"
    weight: 40
    flow:
      # Login as payment processor
      - post:
          url: "/api/auth/login"
          json:
            email: "payment-{{ $randomInt(1, 3) }}@okaeri.com"
            password: "Payment123!"
          capture:
            - json: "$.token"
              as: "auth_token"
            - json: "$.user.id"
              as: "user_id"
          expect:
            - statusCode: 200

      # Create booking to get transaction context
      - post:
          url: "/api/booking/create"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          json:
            project_id: "{{ $randomChoice(project_ids) }}"
            guest_name: "{{ $randomChoice(customers).name }}"
            guest_email: "{{ $randomChoice(customers).email }}"
            guest_phone: "{{ $randomChoice(customers).phone }}"
            check_in: "2025-10-15"
            check_out: "2025-10-17"
            room_type: "standard"
            guests: "{{ $randomInt(1, 4) }}"
          expect:
            - statusCode: 201
          capture:
            - json: "$.booking.id"
              as: "booking_id"
            - json: "$.booking.total_amount"
              as: "total_amount"

      # Process payment through primary gateway (PayMongo)
      - post:
          url: "/api/payment/process"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          json:
            project_id: "{{ $randomChoice(project_ids) }}"
            amount: "{{ total_amount }}"
            currency: "PHP"
            method: "credit_card"
            gateway: "PAYMONGO"
            transaction_type: "booking"
            transaction_id: "{{ booking_id }}"
            customer_name: "{{ $randomChoice(customers).name }}"
            customer_email: "{{ $randomChoice(customers).email }}"
            gateway_data:
              card_number: "4571736000000075" # Test card
              exp_month: "12"
              exp_year: "25"
              cvc: "123"
          expect:
            - statusCode: 201
          capture:
            - json: "$.id"
              as: "payment_id"
            - json: "$.status"
              as: "payment_status"

      # Verify payment status
      - get:
          url: "/api/payment/{{ payment_id }}/status"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          expect:
            - statusCode: 200

  - name: "Gateway Failover Simulation"
    weight: 30
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "failover-{{ $randomInt(1, 2) }}@okaeri.com"
            password: "Failover123!"
          capture:
            - json: "$.token"
              as: "auth_token"
          expect:
            - statusCode: 200

      # Try payment with potentially failing gateway first
      - post:
          url: "/api/payment/process-with-failover"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          json:
            project_id: "{{ $randomChoice(project_ids) }}"
            amount: "{{ $randomChoice(payment_scenarios).amount }}"
            currency: "PHP"
            method: "gcash"
            primary_gateway: "GCASH"
            fallback_gateways: ["PAYMONGO", "DRAGONPAY"]
            transaction_type: "income"
            transaction_id: "income-{{ $randomString() }}"
            customer_name: "{{ $randomChoice(customers).name }}"
            gateway_data:
              gcash_reference: "{{ $randomInt(1000000000000, 9999999999999) }}"
              sender_name: "{{ $randomChoice(customers).name }}"
              sender_number: "{{ $randomChoice(customers).phone }}"
            retry_config:
              max_attempts: 3
              backoff_multiplier: 2
              initial_delay: 1000
          expect:
            # Should eventually succeed through failover
            - statusCode: 201
          capture:
            - json: "$.gateway_used"
              as: "successful_gateway"
            - json: "$.retry_attempts"
              as: "retry_count"

  - name: "Multiple Gateway Load Balancing"
    weight: 20
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "loadbalance-{{ $randomInt(1, 2) }}@okaeri.com"
            password: "LoadBalance123!"
          capture:
            - json: "$.token"
              as: "auth_token"
          expect:
            - statusCode: 200

      # Distribute payments across all gateways
      - function: "selectRandomGateway"
      - post:
          url: "/api/payment/process"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          json:
            project_id: "{{ $randomChoice(project_ids) }}"
            amount: "{{ $randomChoice(payment_scenarios).amount }}"
            method: "{{ selected_method }}"
            gateway: "{{ selected_gateway }}"
            transaction_type: "other"
            transaction_id: "loadtest-{{ $randomString() }}"
            customer_name: "{{ $randomChoice(customers).name }}"
            description: "Load balancing test payment"
          expect:
            - statusCode: 201

      # Verify distributed load across gateways
      - get:
          url: "/api/payment/gateway-stats"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          qs:
            project_id: "{{ $randomChoice(project_ids) }}"
            period: "last_hour"
          expect:
            - statusCode: 200

  - name: "Payment Retry Mechanism Testing"
    weight: 10
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "retry-test@okaeri.com"
            password: "Retry123!"
          capture:
            - json: "$.token"
              as: "auth_token"
          expect:
            - statusCode: 200

      # Simulate payment that requires retries
      - post:
          url: "/api/payment/process-with-retries"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          json:
            project_id: "{{ $randomChoice(project_ids) }}"
            amount: "{{ $randomChoice(payment_scenarios).amount }}"
            method: "bank_transfer"
            gateway: "DRAGONPAY"
            transaction_type: "booking"
            transaction_id: "retry-{{ $randomString() }}"
            simulate_failure: true # Force initial failures for retry testing
            max_retries: 5
            exponential_backoff: true
          expect:
            - statusCode: 201

      # Monitor retry performance
      - get:
          url: "/api/payment/retry-metrics"
          headers:
            Authorization: "Bearer {{ auth_token }}"
          expect:
            - statusCode: 200

# Artillery functions for gateway selection
functions:
  selectRandomGateway: |
    const gateways = context.vars.gateways;
    const gateway = gateways[Math.floor(Math.random() * gateways.length)];
    context.vars.selected_gateway = gateway.id;

    // Select compatible payment method for the gateway
    const methods = gateway.methods;
    context.vars.selected_method = methods[Math.floor(Math.random() * methods.length)];

    // Simulate gateway reliability
    context.vars.simulate_failure = Math.random() > gateway.reliability;
